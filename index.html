<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Donat Game Shop</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- FontAwesome piktogrammalari -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Loading Screen (Splash Screen) -->
  <div id="loading-screen" class="loading-screen">
    <div class="loader-content">
      <div class="mascot-icon">
        <i class="fa-solid fa-gem float-gem"></i>
        <i class="fa-solid fa-gamepad main-mascot"></i>
      </div>
      <h2 class="brand-title">DONAT SHOP</h2>
      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
    </div>
  </div>

  <!-- Main App Container -->
  <div id="app" class="app-container hidden">
    
    <!-- Top Bar -->
    <header class="top-header">
      <div class="user-profile">
        <div class="avatar" id="user-avatar"><i class="fa-solid fa-user"></i></div>
        <span class="user-name" id="user-name">Foydalanuvchi</span>
      </div>
      <div class="theme-toggle">
        <i class="fa-solid fa-moon"></i>
      </div>
    </header>

    <!-- Balance Card Section -->
    <section class="balance-card">
      <div class="balance-title">Balans</div>
      <div class="balance-amount"><span id="balance">0</span> <small>so'm</small></div>
      
      <div class="quick-actions">
        <button class="action-btn" onclick="topUpBalance()">
          <i class="fa-solid fa-wallet"></i>
          <span>Hisobni to'ldirish</span>
        </button>
        <button class="action-btn" onclick="openBonusCode()">
          <i class="fa-solid fa-gift"></i>
          <span>Bonus kodlar</span>
        </button>
        <button class="action-btn" onclick="openSupport()">
          <i class="fa-solid fa-headset"></i>
          <span>Qo'llab-quvvatlash</span>
        </button>
      </div>
    </section>

    <!-- Games Grid Section -->
    <main class="games-section">
      <div class="section-title">O'yinlar va Xizmatlar</div>
      
      <div class="games-grid">
        <!-- Game Item 1 -->
        <div class="game-card" onclick="selectGame('PUBG Mobile')">
          <div class="badge badge-global">Global</div>
          <div class="star-icon"><i class="fa-solid fa-star"></i></div>
          <div class="game-image-placeholder pubg-bg">
            <i class="fa-solid fa-crosshair"></i>
          </div>
          <div class="game-title">PUBG MOBILE</div>
        </div>

        <!-- Game Item 2 -->
        <div class="game-card" onclick="selectGame('Free Fire')">
          <div class="badge badge-sng">SNG</div>
          <div class="star-icon"><i class="fa-solid fa-star"></i></div>
          <div class="game-image-placeholder ff-bg">
            <i class="fa-solid fa-fire"></i>
          </div>
          <div class="game-title">FREE FIRE</div>
        </div>

        <!-- Game Item 3 -->
        <div class="game-card" onclick="selectGame('Telegram Premium')">
          <div class="badge badge-auto">AVTO</div>
          <div class="star-icon"><i class="fa-solid fa-star"></i></div>
          <div class="game-image-placeholder tg-bg">
            <i class="fa-solid fa-paper-plane"></i>
          </div>
          <div class="game-title">TG PREMIUM</div>
        </div>

        <!-- Game Item 4 -->
        <div class="game-card" onclick="selectGame('Telegram Stars')">
          <div class="badge badge-auto">AVTO</div>
          <div class="star-icon"><i class="fa-solid fa-star"></i></div>
          <div class="game-image-placeholder star-bg">
            <i class="fa-solid fa-star-half-stroke"></i>
          </div>
          <div class="game-title">TG STARS</div>
        </div>
      </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
      <button class="nav-item active" onclick="switchTab('home')">
        <i class="fa-solid fa-house"></i>
        <span>Bosh sahifa</span>
      </button>
      <button class="nav-item" onclick="switchTab('history')">
        <i class="fa-solid fa-clock-rotate-left"></i>
        <span>Tarix</span>
      </button>
      <button class="nav-item" onclick="switchTab('settings')">
        <i class="fa-solid fa-user-gear"></i>
        <span>Sozlamalar</span>
      </button>
      <button class="nav-item" onclick="switchTab('rent')">
        <i class="fa-solid fa-key"></i>
        <span>Ijaraga</span>
      </button>
    </nav>

  </div>

  <script src="script.js"></script>
</body>
</html>
